<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Studio</title>
<meta name="description" content="QR Studio — custom QR codes in your browser">
<style>
:root{--bg:#f7f3fb;--ink:#1d1330;--mut:#6d6183;--card:rgba(255,255,255,.68);--line:rgba(70,35,120,.13);--ac:#c2185b;--ac2:#6d28d9;--r:20px;color-scheme:light}
:root[data-theme=dark]{--bg:#0f0918;--ink:#f4eeff;--mut:#a597bd;--card:rgba(34,22,54,.62);--line:rgba(200,170,255,.14);--ac:#ff5c93;--ac2:#a78bfa;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 380px at 12% 8%,color-mix(in srgb,var(--ac) 22%,transparent),transparent),radial-gradient(560px 420px at 92% 30%,color-mix(in srgb,var(--ac2) 22%,transparent),transparent)}
button,input,select{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,48px);position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800}
.brand i{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 90deg,var(--ac),var(--ac2),var(--ac));box-shadow:inset 0 0 0 6px var(--bg),inset 0 0 0 8px var(--ink)}
main{max-width:1120px;margin:auto;padding:0 clamp(14px,4vw,32px) 48px}
.hero{text-align:center;padding:clamp(28px,6vw,64px) 0 24px}
h1{font-size:clamp(2.1rem,7vw,4.2rem);line-height:1.15;margin:0 0 12px;font-weight:800}
.sub{color:var(--mut);font-size:clamp(1rem,2.4vw,1.2rem);max-width:640px;margin:0 auto 28px}
.types{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;justify-content:center;flex-wrap:wrap}
.types button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;cursor:pointer;transition:.2s;white-space:nowrap}
.types button:hover{border-color:var(--ac)}
.types button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{border-radius:var(--r);border:1px solid var(--line);padding:clamp(14px,3vw,24px)}
.glass{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px -24px rgba(60,20,110,.35)}
.entry{max-width:720px;margin:auto;text-align:start;display:grid;gap:14px}
#fields{display:grid;gap:12px}
.fld{display:grid;gap:4px}.fld>span,.f>span{font-size:.85rem;color:var(--mut)}
input[type=text],input[type=url],input[type=tel],input[type=email],textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,transparent);outline:none;transition:.2s}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.big{font-size:1.15rem;padding:16px 18px;min-height:58px}
textarea{resize:vertical}
.cta{border:0;border-radius:14px;padding:15px;font-weight:700;font-size:1.05rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));transition:transform .15s,filter .2s}
.cta:hover{filter:brightness(1.08)}.cta:active{transform:scale(.98)}.cta.load{opacity:.7;pointer-events:none}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start;margin-top:8px}
.prev{position:sticky;top:76px;display:grid;gap:14px;justify-items:center}
.stage{width:100%;max-width:420px;border-radius:16px;overflow:hidden;transition:opacity .25s}
.stage.sample{opacity:.45;filter:saturate(.6)}
.stage svg{display:block;width:100%;height:auto}
.warn{margin:0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#f59e0b 18%,transparent);border:1px solid #f59e0b;font-size:.88rem;width:100%}
.warn.err{background:color-mix(in srgb,#ef4444 16%,transparent);border-color:#ef4444}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.btn{flex:1 1 90px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;pointer-events:none}
.ghost{background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 11px;cursor:pointer;transition:.2s;font-size:.92rem}
.ghost:hover{background:var(--card);border-color:var(--line)}
.ctl details{border-bottom:1px solid var(--line);padding:6px 0}.ctl details:last-child{border:0}
summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--mut)}details[open]>summary::after{content:"–"}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 0 14px}
.f{display:grid;gap:5px;align-content:start}.f.wide{grid-column:1/-1}.f.chk{display:flex;align-items:center;gap:8px;align-self:end}
input[type=color]{width:100%;height:42px;padding:3px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=file]{font-size:.85rem;width:100%}
.presets{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 12px}
.presets button{border:2px solid var(--card);border-radius:99px;padding:7px 12px;cursor:pointer;color:#fff;font-size:.82rem;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .15s}
.presets button:hover{transform:scale(1.06)}
.blk{margin-top:44px}h2{font-size:1.5rem;margin:0 0 16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px;cursor:pointer;text-align:center;transition:.2s;font-size:.82rem}
.tile:hover{transform:translateY(-3px);border-color:var(--ac)}
.tile[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.tile svg{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:6px}
.hist .tile{font-size:.75rem;overflow:hidden}.hist .tile span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut)}.foot{text-align:center;margin-top:48px;font-size:.85rem}
dialog{border:0;border-radius:24px;padding:20px;background:var(--bg);color:var(--ink);width:min(92vw,620px)}
dialog::backdrop{background:rgba(10,4,20,.7);backdrop-filter:blur(6px)}
#fsq svg{width:100%;height:auto;display:block;border-radius:14px}
#fsx{position:absolute;top:8px;inset-inline-end:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.work{grid-template-columns:1fr}.prev{position:static}.types{flex-wrap:nowrap;justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <b class="brand"><i></i>QR Studio</b>
  <div><button id="lang" class="ghost" type="button">EN</button><button id="theme" class="ghost" type="button" aria-label="Theme">◐</button></div>
</header>
<main>
<section class="hero">
  <h1 data-t="h1"></h1>
  <p class="sub" data-t="sub"></p>
  <div class="types" id="types" role="tablist"></div>
  <div class="card glass entry"><div id="fields"></div><button id="go" class="cta" type="button" data-t="go"></button></div>
</section>

<section class="work">
  <div class="card glass prev">
    <div id="stage" class="stage" aria-live="polite"></div>
    <p id="warn" class="warn" hidden></p>
    <div class="row">
      <button class="btn pri" data-dl="png" data-t="png"></button>
      <button class="btn" data-dl="svg" data-t="svg"></button>
      <button class="btn" data-dl="jpg" data-t="jpg"></button>
      <button class="btn" data-dl="pdf" data-t="pdf"></button>
    </div>
    <div class="row tools">
      <button class="ghost" id="copy" data-t="copy"></button>
      <button class="ghost" id="share" data-t="share"></button>
      <button class="ghost" id="random" data-t="random"></button>
      <button class="ghost" id="full" data-t="full"></button>
      <button class="ghost" id="reset" data-t="reset"></button>
    </div>
  </div>

  <div class="card glass ctl">
    <details open><summary data-t="colors"></summary>
      <div class="presets" id="presets"></div>
      <div class="g2">
        <label class="f"><span data-t="fg"></span><input type="color" data-k="fg"></label>
        <label class="f"><span data-t="bg"></span><input type="color" data-k="bg"></label>
        <label class="f chk"><input type="checkbox" data-k="grad"><span data-t="grad"></span></label>
        <label class="f"><span data-t="fg2"></span><input type="color" data-k="fg2"></label>
      </div>
    </details>
    <details open><summary data-t="shape"></summary>
      <div class="g2">
        <label class="f"><span data-t="eye"></span>
          <select data-k="eye"><option value="square">Square</option><option value="rounded">Rounded</option><option value="circle">Circle</option><option value="heart">Heart</option><option value="diamond">Diamond</option><option value="flower">Flower</option></select></label>
        <label class="f" id="vwrap"><span data-t="variant"></span><select data-k="v" id="variant"></select></label>
        <label class="f"><span data-t="size"></span><input type="range" min="200" max="600" step="10" data-k="size"></label>
        <label class="f"><span data-t="margin"></span><input type="range" min="0" max="8" step="1" data-k="margin"></label>
        <label class="f"><span data-t="ecl"></span>
          <select data-k="ecl"><option value="L">L · 7%</option><option value="M">M · 15%</option><option value="Q">Q · 25%</option><option value="H">H · 30%</option></select></label>
      </div>
    </details>
    <details><summary data-t="logo"></summary>
      <div class="g2">
        <label class="f"><span data-t="upload"></span><input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp"></label>
        <label class="f"><span data-t="logoSize"></span><input type="range" min="8" max="34" step="1" data-k="logoSize"></label>
      </div>
      <button class="ghost" id="rmLogo" data-t="rmLogo" type="button"></button>
    </details>
    <details><summary data-t="text"></summary>
      <div class="g2">
        <label class="f wide"><span data-t="caption"></span><input type="text" maxlength="60" data-k="caption"></label>
        <label class="f"><span data-t="font"></span>
          <select data-k="font"><option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option><option value="round">Rounded</option><option value="script">Script</option></select></label>
        <label class="f"><span data-t="fsize"></span><input type="range" min="12" max="48" step="1" data-k="fsize"></label>
        <label class="f"><span data-t="tcolor"></span><input type="color" data-k="tcolor"></label>
      </div>
    </details>
  </div>
</section>

<section class="blk"><h2 data-t="gal"></h2><div id="gallery" class="gal"></div></section>
<section class="blk"><h2 data-t="hist"></h2><div id="hist" class="gal hist"></div><p id="histEmpty" class="mut" data-t="histEmpty"></p></section>
<footer class="foot mut" data-t="foot"></footer>
</main>

<dialog id="fs"><button id="fsx" class="ghost" aria-label="Close">✕</button><div id="fsq"></div></dialog>
<div id="toast" role="status"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {

    if (kind === 'sel') { inp = document.createElement('select'); opts.forEach(o => { const op = document.createElement('option'); op.value = op.textContent = o; inp.append(op); }); }
    else if (kind === 'area') { inp = document.createElement('textarea'); inp.rows = 3; }
    else { inp = document.createElement('input'); inp.type = kind === 'url' ? 'text' : kind; if (kind === 'url') inp.inputMode = 'url'; inp.autocomplete = 'off'; }
    inp.dataset.f = k; inp.value = V[k] || (kind === 'sel' ? opts[0] : ''); if (i === 0) { inp.classList.add('big'); if (S.type === 'url' || S.type === 'text') inp.placeholder = t('ph'); }
    inp.maxLength = 1200; w.append(sp, inp); box.append(w);
  });
}
function renderVariant() {
  const st = ST.find(x => x.id === S.style), sel = $('#variant'); sel.textContent = ''; $('#vwrap').hidden = !st.vs;
  (st.vs || []).forEach((n, i) => { const o = document.createElement('option'); o.value = i; o.textContent = n; sel.append(o); }); sel.value = S.v;
}
function syncControls() {
  $$('[data-k]').forEach(el => { const k = el.dataset.k; if (el.type === 'checkbox') el.checked = !!S[k]; else el.value = S[k]; });
  renderVariant();
}
function pickStyle(id) { const st = ST.find(x => x.id === id); Object.assign(S, { style: id, v: st.vs ? 1 : 1 }, st.p || {}); syncControls(); draw(); renderGallery(); }
function renderGallery() {
  const g = $('#gallery'); g.textContent = '';
  ST.forEach(st => { const s = { ...S, ...(st.p || {}), style: st.id, v: 1, margin: 1, caption: '', logo: '', size: 100, ecl: 'M' };
    const b = document.createElement('button'); b.className = 'tile'; b.type = 'button'; b.setAttribute('aria-pressed', S.style === st.id);
    try { b.innerHTML = build(s, 'QR Studio', { mini: true }).svg; } catch (e) { }
    const sp = document.createElement('span'); sp.textContent = L === 'ar' ? st.a : st.e; b.append(sp); b.onclick = () => pickStyle(st.id); g.append(b); });
}
function renderPresets() {
  const box = $('#presets'); box.textContent = '';
  PRESETS.forEach(([e, a, c1, c2, bg]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = L === 'ar' ? a : e; b.style.background = `linear-gradient(135deg,${c1},${c2})`;
    b.onclick = () => { Object.assign(S, { fg: c1, fg2: c2, bg, grad: c1 !== c2, tcolor: c1 }); syncControls(); draw(); renderGallery(); }; box.append(b); });
}

/* ---------- history ---------- */
const HK = 'qrs_hist';
const loadH = () => { try { return JSON.parse(localStorage.getItem(HK)) || []; } catch (e) { return []; } };
function saveH() {
  const pl = (() => { try { return payload(S.type, V); } catch (e) { return ''; } })(); if (!pl) return;
  const e = { t: Date.now(), S: { ...S, logo: S.logo.length < 150000 ? S.logo : '' }, V: { ...V }, label: pl.slice(0, 40) };
  const h = [e, ...loadH().filter(x => x.label !== e.label || x.S.style !== e.S.style)].slice(0, 10);
  try { localStorage.setItem(HK, JSON.stringify(h)); } catch (err) { try { localStorage.setItem(HK, JSON.stringify(h.map(x => ({ ...x, S: { ...x.S, logo: '' } })))); } catch (e2) { } }
  renderHist();
}
function renderHist() {
  const box = $('#hist'); box.textContent = ''; const h = loadH(); $('#histEmpty').hidden = !!h.length;
  h.forEach(e => { const b = document.createElement('button'); b.className = 'tile'; b.type = 'button';
    try { b.innerHTML = build({ ...DEF, ...e.S, margin: 1, caption: '', size: 100 }, payload(e.S.type, e.V) || 'x', { mini: true }).svg; } catch (x) { return; }
    const sp = document.createElement('span'); sp.textContent = e.label; b.append(sp);
    b.onclick = () => { S = { ...DEF, ...e.S }; V = { ...e.V }; renderTypes(); renderFields(); syncControls(); draw(); renderGallery(); $('.prev').scrollIntoView({ behavior: 'smooth', block: 'center' }); }; box.append(b); });
}

/* ---------- export ---------- */
function fresh() { const pl = payload(S.type, V); return build(S, pl); }
function toCanvas(bg) {
  return new Promise((res, rej) => { const { svg, W, H } = fresh(), img = new Image(), url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    img.onload = () => { const cw = 2400, c = document.createElement('canvas'); c.width = cw; c.height = Math.round(cw * H / W); const x = c.getContext('2d'); x.fillStyle = bg || '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; img.src = url; });
}
const blobOf = (c, mime, q) => new Promise(r => c.toBlob(r, mime, q));
function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function makePdf(jpg, w, h) {
  const enc = new TextEncoder(), parts = [], offs = []; let off = 0; const add = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); off += b.length; };
  const s = Math.min(480 / w, 480 / h), pw = (w * s).toFixed(2), ph = (h * s).toFixed(2), X = ((595 - w * s) / 2).toFixed(2), Y = ((842 - h * s) / 2).toFixed(2), content = `q ${pw} 0 0 ${ph} ${X} ${Y} cm /I Do Q`;
  add('%PDF-1.4\n');
  const o = (i, body, bin) => { offs[i] = off; add(`${i} 0 obj\n${body}`); if (bin) { add(bin); add('\nendstream'); } add('\nendobj\n'); };
  o(1, '<</Type/Catalog/Pages 2 0 R>>'); o(2, '<</Type/Pages/Kids[3 0 R]/Count 1>>');
  o(3, '<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</I 5 0 R>>>>/Contents 4 0 R>>');
  o(4, `<</Length ${content.length}>>\nstream\n${content}\nendstream`);
  o(5, `<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`, jpg);
  const xo = off; add('xref\n0 6\n0000000000 65535 f \n'); for (let i = 1; i <= 5; i++) add(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  add(`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xo}\n%%EOF`); return new Blob(parts, { type: 'application/pdf' });
}
async function download(kind) {
  if (!ok) return toast(t('errEmpty'));
  try {
    if (kind === 'svg') return save(new Blob([fresh().svg], { type: 'image/svg+xml' }), 'qr-studio.svg');
    const c = await toCanvas();
    if (kind === 'png') return save(await blobOf(c, 'image/png'), 'qr-studio.png');
    if (kind === 'jpg') return save(await blobOf(c, 'image/jpeg', .95), 'qr-studio.jpg');
    const jpg = new Uint8Array(await (await blobOf(c, 'image/jpeg', .95)).arrayBuffer()); save(makePdf(jpg, c.width, c.height), 'qr-studio.pdf');
  } catch (e) { toast('Export failed'); }
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) { V[el.dataset.f] = el.value; return drawSoon(); }
  const k = el.dataset.k; if (!k) return;
  S[k] = el.type === 'checkbox' ? el.checked : (el.type === 'range' || k === 'v') ? +el.value : el.value;
  if (['fg', 'fg2', 'bg', 'grad', 'eye'].includes(k)) drawSoon(); else draw();
});
$('#types').addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
$('#fields').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); $('#go').click(); } });
$('#go').onclick = () => { const b = $('#go'); b.classList.add('load'); draw();
  setTimeout(() => { b.classList.remove('load'); if (!ok) { if ($('#warn').hidden) toast(t('errEmpty')); return; } saveH(); toast(t('saved')); $('.prev').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 350); };
$$('[data-dl]').forEach(b => b.onclick = () => download(b.dataset.dl));
$('#logoFile').onchange = e => { const f = e.target.files[0]; if (!f) return; if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(f.type) || f.size > 3e6) { toast(t('errImg')); return; }
  const r = new FileReader(); r.onload = () => { S.logo = String(r.result); draw(); }; r.readAsDataURL(f); };
$('#rmLogo').onclick = () => { S.logo = ''; $('#logoFile').value = ''; draw(); };
$('#reset').onclick = () => { S = { type: S.type, ...DEF }; syncControls(); draw(); renderGallery(); };
$('#random').onclick = () => { const st = ST[Math.random() * ST.length | 0], p = PRESETS[Math.random() * PRESETS.length | 0], eyes = Object.keys(EYE);
  Object.assign(S, { style: st.id, v: Math.random() * 3 | 0, fg: p[2], fg2: p[3], bg: p[4], grad: p[2] !== p[3], eye: st.p?.eye || eyes[Math.random() * 3 | 0] }, st.p || {}); syncControls(); draw(); renderGallery(); };
$('#full').onclick = () => { $('#fsq').innerHTML = cur.svg; $('#fs').showModal(); };
$('#fsx').onclick = () => $('#fs').close(); $('#fs').addEventListener('click', e => { if (e.target.id === 'fs') e.target.close(); });
$('#copy').onclick = async () => { try { const c = await toCanvas(); await navigator.clipboard.write([new ClipboardItem({ 'image/png': await blobOf(c, 'image/png') })]); toast(t('copied')); }
  catch (e) { try { await navigator.clipboard.writeText(payload(S.type, V)); toast(t('copied')); } catch (x) { toast('Copy failed'); } } };
$('#share').onclick = async () => { try { const c = await toCanvas(), f = new File([await blobOf(c, 'image/png')], 'qr-studio.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: 'QR Studio' });
  else if (navigator.share) await navigator.share({ title: 'QR Studio', text: payload(S.type, V) }); else download('png'); } catch (e) { /* cancelled */ } };
$('#theme').onclick = () => { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = d; localStorage.setItem('qrs_theme', d); };
function applyLang() {
  document.documentElement.lang = L; document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr'; $('#lang').textContent = L === 'ar' ? 'EN' : 'عربي';
  $$('[data-t]').forEach(el => el.textContent = t(el.dataset.t)); renderTypes(); renderFields(); renderPresets(); renderGallery(); renderHist(); draw();
}
$('#lang').onclick = () => { L = L === 'ar' ? 'en' : 'ar'; localStorage.setItem('qrs_lang', L); applyLang(); };

/* ---------- init ---------- */
document.documentElement.dataset.theme = localStorage.getItem('qrs_theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
syncControls(); applyLang();
</script>
