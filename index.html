<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Studio Pro | مستقبل رموز QR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة توليد الـ QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #f43f5e;
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.4;
        }
        body::before { background: var(--accent-primary); top: 10%; left: 10%; }
        body::after { background: var(--accent-secondary); bottom: 10%; right: 10%; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            padding: 25px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(to right, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-icon:hover {
            background: var(--accent-primary);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 850px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--card-shadow);
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card-title i {
            color: var(--accent-secondary);
            background: rgba(6, 182, 212, 0.1);
            padding: 10px;
            border-radius: 12px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-dim);
        }

        select, textarea {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-generate:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .qr-preview-box {
            background: white;
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .qr-preview-box:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .btn-download {
            background: var(--success);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            display: none;
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .history-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .history-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .history-text {
            font-size: 13px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .btn-del {
            background: rgba(244, 63, 94, 0.1);
            color: var(--danger);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-del:hover {
            background: var(--danger);
            color: white;
        }

        .alert {
            display: none;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            background: rgba(244, 63, 94, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            font-size: 14px;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            max-width: 450px;
            border: 1px solid var(--glass-border);
            position: relative;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-bolt"></i>
                QR Studio Pro
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="infoBtn" title="عن البرنامج">
                    <i class="fas fa-circle-info"></i>
                </button>
            </div>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-wand-magic-sparkles"></i>
                    صمم رمزك الخاص
                </div>

                <div class="alert" id="errorAlert">⚠️ يرجى إدخال البيانات أولاً!</div>

                <div class="input-group">
                    <label>نوع المحتوى</label>
                    <select id="dataType">
                        <option value="text">نص حر</option>
                        <option value="url">رابط إلكتروني</option>
                        <option value="email">بريد إلكتروني</option>
                        <option value="phone">رقم اتصال</option>
                    </select>
                </div>

                <div class="input-group">
                    <label id="dataLabel">النص المراد تحويله</label>
                    <textarea id="dataInput" placeholder="اكتب هنا ما تود تحويله إلى رمز QR..."></textarea>
                </div>

                <button class="btn-generate" id="generateBtn">
                    <i class="fas fa-qrcode"></i>
                    توليد الرمز الآن
                </button>
            </div>

            <div class="card">
                <div class="card-title">
                    <i class="fas fa-eye"></i>
                    المعاينة الفورية
                </div>
                <div class="preview-container">
                    <div class="qr-preview-box" id="qrBox">
                        <div id="qrcode"></div>
                    </div>
                    <a href="#" id="downloadBtn" class="btn-download">
                        <i class="fas fa-cloud-download-alt"></i> تحميل الرمز (PNG)
                    </a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <i class="fas fa-clock-rotate-left"></i>
                الأرشيف الذكي
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">QR Studio Pro</div>
            <p style="color: var(--text-dim); line-height: 1.6;">
                منصة متطورة لتحويل البيانات إلى رموز استجابة سريعة بدقة عالية. 
                تتميز بالسرعة، الخصوصية التامة، وتصميم عصري يسهل تجربة المستخدم.
            </p>
        </div>
    </div>

    <script>
        // عناصر الصفحة
        const qrcodeContainer = document.getElementById("qrcode");
        const dataInput = document.getElementById("dataInput");
        const generateBtn = document.getElementById("generateBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const errorAlert = document.getElementById("errorAlert");
        const historyList = document.getElementById("historyList");

        // إنشاء كائن الـ QR
        const qr = new QRCode(qrcodeContainer, {
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // دالة توليد الرمز
        generateBtn.onclick = function() {
            const value = dataInput.value.trim();
            
            if (!value) {
                errorAlert.style.display = "block";
                return;
            }

            errorAlert.style.display = "none";
            qr.makeCode(value);

            // تفعيل زر التحميل
            setTimeout(() => {
                const img = qrcodeContainer.querySelector("img");
                if (img) {
                    downloadBtn.href = img.src;
                    downloadBtn.download = `QR_Code_${Date.now()}.png`;
                    downloadBtn.style.display = "inline-block";
                }
            }, 200);

            saveToHistory(value);
        };

        // دالة حفظ في السجل
        function saveToHistory(text) {
            const card = document.createElement("div");
            card.className = "history-card";
            card.innerHTML = `
                <span class="history-text">${text}</span>
                <button class="btn-del" onclick="this.parentElement.remove()"><i class="fas fa-trash"></i></button>
            `;
            historyList.prepend(card);
        }

        // التحكم في المودال
        document.getElementById("infoBtn").onclick = () => document.getElementById("infoModal").classList.add("show");
        document.getElementById("closeModal").onclick = () => document.getElementById("infoModal").classList.remove("show");
        window.onclick = (event) => {
            if (event.target == document.getElementById("infoModal")) {
                document.getElementById("infoModal").classList.remove("show");
            }
        };

        // تغيير تسمية الحقل بناءً على النوع
        document.getElementById("dataType").onchange = function() {
            const labels = {
                text: "النص المراد تحويله",
                url: "أدخل رابط الموقع (URL)",
                email: "أدخل البريد الإلكتروني",
                phone: "أدخل رقم الهاتف"
            };
            document.getElementById("dataLabel").innerText = labels[this.value];
        };
    </script>
</body>
